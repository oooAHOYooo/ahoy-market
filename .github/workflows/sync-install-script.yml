name: Sync install script to GitHub Pages

# Keeps docs/install in sync with scripts/install.sh automatically.
# This is what gets.ahoy.ooo/install serves.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install.sh'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync install.sh → docs/install
        run: cp scripts/install.sh docs/install

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/install
          git diff --cached --quiet || git commit -m "chore: sync install script to pages"
          git push
